<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <<meta name="author" content="Luc Chodaton">
        <meta name="description" content="" Share your thoughts about a product, rate your experience, and tell us which
            features you liked the most.">
        <title>Product Review Form</title>
        <link rel="stylesheet" href="styles/form.css">
        <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <label for="productName">Product Name</label>
            <select id="productName" name="productName" required>
                <option value="" disabled selected>
                    Select a Product ...
                </option>
            </select>

            <fieldset>
                <legend>Overall Rating</legend>

                <div class="rating">
                    <label for="rating1">
                        <input type="radio" id="rating1" name="rating" value="1" required>
                        ☆
                    </label>

                    <label for="rating2">
                        <input type="radio" id="rating2" name="rating" value="2" required>
                        ☆☆
                    </label>

                    <label for="rating3">
                        <input type="radio" id="rating3" name="rating" value="3" required>
                        ☆☆☆
                    </label>

                    <label for="rating4">
                        <input type="radio" id="rating4" name="rating" value="4" required>
                        ☆☆☆☆
                    </label>

                    <label for="rating5">
                        <input type="radio" id="rating5" name="rating" value="5" required>
                        ☆☆☆☆☆
                    </label>
                </div>
            </fieldset>

            <label for="installDate">Date of Installation</label>
            <input type="date" id="installDate" name="installDate" required>

            <fieldset>
                <legend>Useful Features</legend>

                <label for="durability">
                    <input type="checkbox" id="durability" name="features" value="Durability">
                    Durability
                </label>

                <label for="ease">
                    <input type="checkbox" id="ease" name="features" value="Ease of Use">
                    Ease of Use
                </label>

                <label for="performance">
                    <input type="checkbox" id="performance" name="features" value="Performance">
                    Performance
                </label>

                <label for="design">
                    <input type="checkbox" id="design" name="features" value="Design">
                    Design
                </label>
            </fieldset>

            <label for="writtenReview">
                Written Review (Optional)
            </label>
            <textarea id="writtenReview" name="writtenReview" rows="5"></textarea>

            <label for="userName">Your Name (Optional)</label>
            <input type="text" id="userName" name="userName">

            <input type="submit" value="Submit Review">
        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentYear"></span> Product Review</p>
        <p>WDD 131 - Dynamic Web Fundamentals</p>
        <p>Last modified: <span id="lastModified"></span></p>
    </footer>
</body>

</html>
